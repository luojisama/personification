<!doctype html>
<html lang="zh-CN" data-theme="minimal" data-color-mode="system" data-effective-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="Personification 拟人插件管理员事件取证台"
    />
    <script>
      (() => {
        const allowedThemes = new Set(["minimal", "schale", "prts"]);
        const allowedModes = new Set(["system", "light", "dark"]);
        let theme = "minimal";
        let mode = "system";
        try {
          const savedTheme = localStorage.getItem("personification.console.theme");
          const savedMode = localStorage.getItem("personification.console.color-mode");
          if (savedTheme && allowedThemes.has(savedTheme)) theme = savedTheme;
          if (savedMode && allowedModes.has(savedMode)) mode = savedMode;
        } catch (_) {}
        const systemDark = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
        const scheme = theme === "schale" ? "light" : theme === "prts" ? "dark" : mode === "system" ? (systemDark ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.colorMode = mode;
        document.documentElement.dataset.effectiveScheme = scheme;
        document.documentElement.style.colorScheme = scheme;
      })();
    </script>
    <title>Personification · 事件取证台</title>
    <script type="module" crossorigin src="/personification/frontend/assets/index-v4B8ZrEJ.js"></script>
    <link rel="stylesheet" crossorigin href="/personification/frontend/assets/index-cMxKwFUx.css">
  </head>
  <body>
    <div id="vue-root"></div>
    <noscript>此管理台需要启用 JavaScript。</noscript>
  </body>
</html>
