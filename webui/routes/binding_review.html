<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号绑定审核</title><style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:20px;background:#f5f7fa;color:#182434}article{background:white;padding:24px;margin:16px 0;border-radius:12px}button,textarea{font:inherit;margin:8px;padding:10px}textarea{display:block;width:85%}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.4}</style>
<a href="/personification/">返回控制台</a><h1>账号绑定审核</h1><p>申报 QQ 号未经验证。请通过独立渠道核验本人控制权，不能仅凭昵称、头像批准。绑定不授予管理员权限。</p><p id="status"></p><button id="refresh">刷新申请</button><main id="items"></main>
<script>
const status=document.querySelector('#status'),items=document.querySelector('#items');
async function api(path,body){const headers={};if(body){headers['Content-Type']='application/json';const cookie=document.cookie.split('; ').find(v=>v.startsWith('personification_webui_csrf='));headers['X-Personification-CSRF']=cookie?decodeURIComponent(cookie.slice(cookie.indexOf('=')+1)):'';}const r=await fetch('/personification/api/'+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求失败');return d;}
async function load(){try{const d=await api('binding-requests');status.textContent=d.ready?'审批时会再次检查资产冲突。':'共享资产尚未就绪：可查看或拒绝申请，暂不能批准。';items.replaceChildren();for(const row of d.items){const card=document.createElement('article'),text=document.createElement('pre');text.textContent='申请：'+row.id+'\n申报 QQ（未验证）：'+row.qq+'\n官方 App：'+row.app+'\n官方身份：'+row.subject+'\n资产摘要：'+JSON.stringify(row.assets,null,2)+'\n状态：'+({pending:'待核验',approved:'已批准',rejected:'已拒绝'}[row.status]||'未知状态')+(row.note?'\n审核记录：'+row.note:'');card.append(text);if(row.status==='pending'){const note=document.createElement('textarea');note.placeholder='填写核验依据，不要填写密码或验证码';note.maxLength=500;card.append(note);for(const [label,approve] of [['核验通过并绑定',true],['拒绝申请',false]]){const b=document.createElement('button');b.textContent=label;b.disabled=approve&&!d.ready;b.onclick=async()=>{if(!note.value.trim()){status.textContent='请填写核验依据';return;}b.disabled=true;try{await api('binding-requests/'+encodeURIComponent(row.id)+'/review',{approve,note:note.value});await load();}catch(e){status.textContent=e.message;b.disabled=approve&&!d.ready;}};card.append(b);}}items.append(card);}}catch(e){status.textContent=e.message;}}
document.querySelector('#refresh').onclick=load;load();
</script></html>
